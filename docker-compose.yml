services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================
  postgres:
    image: postgres:17-alpine
    container_name: alertacore-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Alertcore}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123456}

    ports:
      - "5433:5432"

    volumes:
      - alertacore-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-Alertcore}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - alertacore-network


  # ==========================================================
  # RESOURCE SERVICE
  # ==========================================================
  resource-service:
    build:
      context: .
      dockerfile: resource-service/Dockerfile

    container_name: alertacore-resource-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8082

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-Alertcore}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}

      MANAGEMENT_HEALTH_SHOW_DETAILS: always

      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"

    ports:
      - "8082:8082"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8082/actuator/health | grep -q 'UP'"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - alertacore-network


  # ==========================================================
  # INCIDENT SERVICE
  # ==========================================================
  incident-service:
    build:
      context: .
      dockerfile: incident-service/Dockerfile

    container_name: alertacore-incident-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8081

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-Alertcore}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}

      RESOURCE_SERVICE_URL: http://resource-service:8082

      MANAGEMENT_HEALTH_SHOW_DETAILS: always

      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"

    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy
      resource-service:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8081/actuator/health | grep -q 'UP'"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - alertacore-network


  # ==========================================================
  # NOTIFICATION SERVICE
  # ==========================================================

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile

    container_name: alertacore-notification-service
    restart: unless-stopped

    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8083

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-Alertcore}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123456}

      # Correo electronico
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      NOTIFICACIONES_EMAIL_REMITENTE: ${NOTIFICACIONES_EMAIL_REMITENTE:-}

      # Telegram
      TELEGRAM_HABILITADO: ${TELEGRAM_HABILITADO:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}

      MANAGEMENT_HEALTH_SHOW_DETAILS: always
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"

    ports:
      - "8083:8083"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8083/actuator/health | grep -q 'UP'"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - alertacore-network



# ============================================================
# VOLUMENES
# ============================================================
volumes:
  alertacore-postgres-data:
    name: alertacore-postgres-data


# ============================================================
# RED INTERNA
# ============================================================
networks:
  alertacore-network:
    name: alertacore-network
    driver: bridge