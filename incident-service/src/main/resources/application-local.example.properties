server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/Alertcore
spring.datasource.username=postgres
spring.datasource.password=CAMBIARCONTRASEÑA
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=incidents

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=incidents
spring.flyway.default-schema=incidents
spring.flyway.create-schemas=true

management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=always