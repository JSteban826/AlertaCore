# ============================================================
# CONFIGURACION DEL ENTORNO LOCAL
# No subir este archivo con credenciales reales al repositorio.
# ============================================================

# PostgreSQL local
spring.datasource.url=jdbc:postgresql://localhost:5432/Alertcore
spring.datasource.username=postgres
spring.datasource.password=123456

# Mostrar SQL solo cuando sea necesario durante el desarrollo
spring.jpa.show-sql=false

# Resource Service ejecutado localmente
services.resource.base-url=http://localhost:8082

# Actuator permite detalles completos en desarrollo
management.endpoint.health.show-details=always