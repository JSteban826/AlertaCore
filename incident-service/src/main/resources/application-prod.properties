# ============================================================
# CONFIGURACION DEL ENTORNO DE PRODUCCION
# ============================================================

# PostgreSQL de Railway
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# URL publica o privada del resource-service en Railway
services.resource.base-url=${RESOURCE_SERVICE_URL}

# Configuracion de produccion
spring.jpa.show-sql=false

# Evita exponer detalles internos en el endpoint de salud
management.endpoint.health.show-details=never

# Swagger puede desactivarse mediante variables de Railway
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}