# ============================================================
# IDENTIFICACION DEL MICROSERVICIO
# ============================================================
spring.application.name=incident-service

# Usa "local" cuando no se proporcione otro perfil.
# En Railway puede establecerse SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Railway proporciona PORT automaticamente.
# En local utiliza 8081 como valor predeterminado.
server.port=${PORT:8081}


# ============================================================
# CONFIGURACION GENERAL DEL DATASOURCE
# ============================================================
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}


# ============================================================
# JPA E HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=incidents


# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=incidents
spring.flyway.default-schema=incidents
spring.flyway.create-schemas=true


# ============================================================
# CACHE CON CAFFEINE
# ============================================================
spring.cache.type=caffeine
spring.cache.cache-names=condicionesMeteorologicas,geocodificaciones
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m


# ============================================================
# CIRCUIT BREAKER DE OPEN-METEO
# ============================================================
resilience4j.circuitbreaker.instances.openMeteo.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.openMeteo.sliding-window-size=10
resilience4j.circuitbreaker.instances.openMeteo.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.openMeteo.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.openMeteo.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.openMeteo.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.openMeteo.automatic-transition-from-open-to-half-open-enabled=true


# ============================================================
# ACTUATOR Y MONITOREO
# ============================================================
management.endpoints.web.exposure.include=health,info,flyway,metrics,circuitbreakers
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}
management.health.circuitbreakers.enabled=true

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Microservicio para la gestion de incidentes de AlertaCore
info.app.version=@project.version@


# ============================================================
# OPENAPI Y SWAGGER UI
# ============================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# Solo incluye los endpoints de incidentes
springdoc.paths-to-match=/api/v1/incidentes/**


# ============================================================
# COMUNICACION CON OTROS MICROSERVICIOS
# ============================================================
services.resource.base-url=${RESOURCE_SERVICE_URL:http://localhost:8082}