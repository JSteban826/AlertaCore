spring.application.name=incident-service
spring.profiles.active=local
server.port=8081

# Conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/Alertcore
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=incidents

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=incidents
spring.flyway.default-schema=incidents
spring.flyway.create-schemas=true