# Hibernate solo valida lo creado por Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway debe ejecutar las migraciones reales
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Esquema utilizado por incident-service
spring.flyway.schemas=incidents
spring.flyway.default-schema=incidents
spring.flyway.create-schemas=true

# Esquema predeterminado de Hibernate
spring.jpa.properties.hibernate.default_schema=incidents

# No ejecutar scripts alternativos de Spring SQL
spring.sql.init.mode=never

# Evitar que servicios externos sean llamados durante el test
spring.cache.type=none