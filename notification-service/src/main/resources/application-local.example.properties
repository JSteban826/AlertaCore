# ============================================================
# EJEMPLO DE CONFIGURACION LOCAL
# ============================================================
# Copiar este archivo como:
# application-local.properties
#
# Luego reemplazar los valores de ejemplo por las credenciales
# correspondientes al entorno local.

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/Alertcore
spring.datasource.username=postgres
spring.datasource.password=CAMBIAR_CONTRASENA

# Desarrollo
spring.jpa.show-sql=false
management.endpoint.health.show-details=always

# Telegram
notificaciones.telegram.habilitado=false
notificaciones.telegram.token=AGREGAR_TOKEN_SI_SE_HABILITA
notificaciones.telegram.chat-id=AGREGAR_CHAT_ID_SI_SE_HABILITA