# ============================================================
# CONFIGURACION DEL ENTORNO DE PRODUCCION
# ============================================================

# PostgreSQL de Railway
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configuracion segura de produccion
spring.jpa.show-sql=false
management.endpoint.health.show-details=never

# Telegram
notificaciones.telegram.habilitado=${TELEGRAM_HABILITADO:false}
notificaciones.telegram.token=${TELEGRAM_BOT_TOKEN:}
notificaciones.telegram.chat-id=${TELEGRAM_CHAT_ID:}

# Swagger desactivado por defecto
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}