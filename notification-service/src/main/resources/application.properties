# ============================================================
# IDENTIFICACION DEL MICROSERVICIO
# ============================================================
spring.application.name=notification-service

# Utiliza el perfil local cuando no se indique otro
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Railway asigna PORT; localmente utiliza 8083
server.port=${PORT:8083}


# ============================================================
# CONFIGURACION GENERAL DEL DATASOURCE
# ============================================================
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}


# ============================================================
# JPA E HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=notifications


# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=notifications
spring.flyway.default-schema=notifications
spring.flyway.create-schemas=true


# ============================================================
# CONFIGURACION DE CORREO ELECTRONICO
# ============================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

notificaciones.email.remitente=${NOTIFICACIONES_EMAIL_REMITENTE:${SPRING_MAIL_USERNAME:}}


# ============================================================
# TELEGRAM
# ============================================================
# La integracion permanece deshabilitada cuando no se proporciona
# la variable TELEGRAM_HABILITADO.
notificaciones.telegram.habilitado=${TELEGRAM_HABILITADO:false}
notificaciones.telegram.token=${TELEGRAM_BOT_TOKEN:}
notificaciones.telegram.chat-id=${TELEGRAM_CHAT_ID:}


# ============================================================
# ACTUATOR Y MONITOREO
# ============================================================
management.endpoints.web.exposure.include=health,info,flyway,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Microservicio para la gestion y envio de notificaciones de AlertaCore
info.app.version=@project.version@


# ============================================================
# OPENAPI Y SWAGGER UI
# ============================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true


# ============================================================
# COMUNICACION CON OTROS MICROSERVICIOS
# ============================================================

notificaciones.incidentes.base-url=${INCIDENT_SERVICE_URL:http://localhost:8081}
notificaciones.recursos.base-url=${RESOURCE_SERVICE_URL:http://localhost:8082}



