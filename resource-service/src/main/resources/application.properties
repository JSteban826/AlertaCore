# ============================================================
# IDENTIFICACION DEL MICROSERVICIO
# ============================================================
spring.application.name=resource-service

# Utiliza local cuando no se especifica otro perfil
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Railway proporciona PORT; localmente utiliza 8082
server.port=${PORT:8082}


# ============================================================
# CONFIGURACION GENERAL DEL DATASOURCE
# ============================================================
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}


# ============================================================
# JPA E HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=resources


# ============================================================
# FLYWAY
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=resources
spring.flyway.default-schema=resources
spring.flyway.create-schemas=true


# ============================================================
# ACTUATOR Y MONITOREO
# ============================================================
management.endpoints.web.exposure.include=health,info,flyway,metrics
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:always}

management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Microservicio para la gestion de recursos de emergencia de AlertaCore
info.app.version=@project.version@


# ============================================================
# OPENAPI Y SWAGGER UI
# ============================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs

springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true

# Solo documenta los endpoints del resource-service
springdoc.paths-to-match=/api/v1/recursos/**